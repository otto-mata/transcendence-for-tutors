  #      - pgadmin:/var/lib/pgadmin

  #   ports:
  #     - "${PGADMIN_PORT:-5050}:80"
  #   networks:
  #     - postgres-network
  #   restart: unless-stopped

networks:
  postgres-network:
    driver: bridge

volumes:
    postgres_data:
    pgadmin:
