services:

  transcendence-back-dev:
    build:
      context: .
      dockerfile: apps/back-end/Dockerfile
      target: development
    container_name: transcendence-dev
    ports:
      - '${APP_PORT:-3000}:3000' # API server
    environment:
      NODE_ENV: development
      DOCKER_ENV: 'true'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-http://localhost:3000}'
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-db}"
      JWT_SECRET: ${JWT_SECRET:-thisisasecret}
    depends_on:
      - postgres #:
        #condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - '**/*.test.*'
            - '**/__tests__/**'
        - action: rebuild
          path: ./package.json
    restart: unless-stopped
    networks:
      - postgres-network
  
  auth-dev:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: development
    container_name: auth-dev
    ports:
      - 3001:3001 # API server
    environment:
      NODE_ENV: development
      DOCKER_ENV: 'true'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-http://localhost:3001}'
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-db}"
      JWT_SECRET: ${JWT_SECRET:-thisisasecret}
    volumes:
      - ./apps/auth/src/:/app/auth/src:ro
      - ./prisma/:/app/prisma:ro
    depends_on:
      - transcendence-back-dev
      - postgres #:
        #condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - '**/*.test.*'
            - '**/__tests__/**'
        - action: rebuild
          path: ./package.json
    restart: unless-stopped
    networks:
      - postgres-network


  postgres:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-db}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - postgres-network


