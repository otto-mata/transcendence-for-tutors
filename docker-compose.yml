# ═══════════════════════════════════════════════════════════════════════════════
# Docker Compose principal avec Reverse Proxy Nginx
# ═══════════════════════════════════════════════════════════════════════════════
#
# Architecture:
#
#   Client (Browser)
#        │
#        ▼ (HTTPS :443)
#   ┌─────────────────────────────────────────────────────────────────────────┐
#   │                          NGINX Reverse Proxy                            │
#   │                    (Terminaison SSL centralisée)                       │
#   └─────────────────────────────────────────────────────────────────────────┘
#        │                           │                           │
#        │ /api/* (HTTP)             │ /ws (HTTP)                │ /* (HTTP)
#        ▼                           ▼                           ▼
#   ┌─────────────┐           ┌─────────────┐           ┌─────────────┐
#   │  Backend    │           │  WebSocket  │           │  Frontend   │
#   │  NestJS     │           │  Server     │           │  Next.js    │
#   │  :3000      │           │  :8090      │           │  :8080      │
#   └─────────────┘           └─────────────┘           └─────────────┘
#        │
#        ▼
#   ┌─────────────┐
#   │  PostgreSQL │
#   │  :5432      │
#   └─────────────┘
#
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # Reverse Proxy - Point d'entrée unique avec SSL
  # ─────────────────────────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-proxy
    ports:
      - "8443:8443"   # HTTPS - seul port exposé au monde extérieur
      - "8080:8080"   # HTTP -> redirige vers HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro   # Certificats SSL
    depends_on:
      - core-api
      - transcendence-front
      - socket-chat
    networks:
      - transcendence-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend API - NestJS (HTTP interne seulement)
  # ─────────────────────────────────────────────────────────────────────────────
  core-api:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: core-api
    # Plus de ports exposés! Nginx y accède via le réseau interne
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DOCKER_ENV: 'true'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ALLOWED_ORIGINS: 'https://localhost:8443'
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-db}"
      JWT_SECRET: ${JWT_SECRET:-thisisasecret}
      # URL publique pour les callbacks OAuth (via le proxy)
      BASE_URL: "https://localhost:8443"
      GOOGLE_CALLBACK_URL: "https://localhost:8443/api/auth/google/redirect"
      FORTYTWO_CALLBACK_URL: "https://localhost:8443/api/auth/42/redirect"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend - Next.js (HTTP interne seulement)
  # ─────────────────────────────────────────────────────────────────────────────
  transcendence-front:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      target: production
    container_name: transcendence-front
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      DOCKER_ENV: 'true'
      # L'API est accessible via le proxy sur le même domaine
      NEXT_PUBLIC_API_URL: "https://localhost:8443/api"
      NEXT_PUBLIC_WS_URL: "wss://localhost:8443/ws"
    networks:
      - transcendence-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # WebSocket Server (HTTP interne seulement)
  # ─────────────────────────────────────────────────────────────────────────────
  socket-chat:
    build:
      context: ./websocket
      dockerfile: Dockerfile
    container_name: socket-chat
    expose:
      - "8090"
    environment:
      WS_PORT: 8090
      JWT_SECRET: ${JWT_SECRET:-thisisasecret}
    networks:
      - transcendence-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Base de données PostgreSQL
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - transcendence-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Prometheus (monitoring) - optionnel
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./back-end/prometheus:/etc/prometheus
      - prom-data:/prometheus
    expose:
      - "9090"
    networks:
      - transcendence-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────────
  # Grafana (dashboard) - optionnel
  # ─────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SERVER_HTTP_PORT: "3002"
    volumes:
      - grafana-storage:/var/lib/grafana
    expose:
      - "3002"
    networks:
      - transcendence-network
    restart: unless-stopped

networks:
  transcendence-network:
    driver: bridge

volumes:
  postgres_data:
  prom-data:
  grafana-storage:
