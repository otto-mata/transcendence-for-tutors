events {
    worker_connections 1024;
}

http {
    # ─────────────────────────────────────────────────────────────────────────
    # Configuration générale
    # ─────────────────────────────────────────────────────────────────────────
    
    # Timeout pour les WebSockets (long polling/persistent connections)
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    
    # Taille maximale des uploads
    client_max_body_size 50M;

    # ─────────────────────────────────────────────────────────────────────────
    # Upstreams - Les services backend en HTTP (internes, non exposés)
    # ─────────────────────────────────────────────────────────────────────────
    
    upstream backend_api {
        server core-api:3000;
    }

    upstream frontend_app {
        server transcendence-front:8080;
    }

    upstream websocket_server {
        server socket-chat:8090;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Serveur HTTPS principal (port 443)
    # ─────────────────────────────────────────────────────────────────────────
    
    server {
        listen 8443 ssl;
        server_name localhost;

        # Certificats SSL (un seul endroit pour tous les services!)
        ssl_certificate /etc/nginx/ssl/public-certificate.pem;
        ssl_certificate_key /etc/nginx/ssl/private-key.pem;
        
        # Configuration SSL moderne et sécurisée
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # ─────────────────────────────────────────────────────────────────────
        # Route: API Backend (/api/*)
        # ─────────────────────────────────────────────────────────────────────
        location /api/ {
            # Rewrite pour enlever le préfixe /api
            rewrite ^/api/(.*) /$1 break;
            
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            
            # Headers pour transmettre l'info client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # ─────────────────────────────────────────────────────────────────────
        # Route: WebSocket (/ws)
        # ─────────────────────────────────────────────────────────────────────
        location /ws {
            proxy_pass http://websocket_server;
            proxy_http_version 1.1;
            
            # Headers essentiels pour WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Headers standard
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout long pour les connexions WebSocket persistantes
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ─────────────────────────────────────────────────────────────────────
        # Route: Frontend (tout le reste)
        # ─────────────────────────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Support pour Next.js Hot Module Reload (dev)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Redirection HTTP -> HTTPS (optionnel mais recommandé)
    # ─────────────────────────────────────────────────────────────────────────
    
    server {
        listen 8080;
        server_name localhost;
        
        # Redirige tout le trafic HTTP vers HTTPS (port 8443)
        return 301 https://$host:8443$request_uri;
    }
}
